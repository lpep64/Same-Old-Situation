[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-testing"
version = "0.1.0"
description = "Physics simulation and robotics examples using MuJoCo for research and education"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Luke Pepin", email = "luke@uri.edu"}
]
keywords = ["mujoco", "physics", "robotics", "simulation", "control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "gymnasium>=0.26.0",
    "stable-baselines3>=2.0.0",
    "matplotlib>=3.5.0",
    "mediapy>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
]
ml = [
    "torch>=1.13.0",
    "tensorboard>=2.10.0",
]
vision = [
    "opencv-python>=4.5.0",
]
analysis = [
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/URI-ISE/MuJoCo-Testing"
Documentation = "https://github.com/URI-ISE/MuJoCo-Testing#readme"
Repository = "https://github.com/URI-ISE/MuJoCo-Testing.git"
Issues = "https://github.com/URI-ISE/MuJoCo-Testing/issues"

[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --strict-markers"
testpaths = ["tests", "demos"]
python_files = ["test_*.py", "*_test.py"]
