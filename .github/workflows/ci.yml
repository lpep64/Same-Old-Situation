name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 demos/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 demos/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        black --check demos/ tests/
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=demos --cov=tests --cov-report=term-missing
      continue-on-error: true
